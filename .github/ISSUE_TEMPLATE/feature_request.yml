name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work (options, outputs, ...)
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other tools or workarounds you have considered
