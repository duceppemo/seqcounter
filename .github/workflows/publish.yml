name: publish

# Publish to PyPI when a GitHub release is published, using PyPI trusted publishing (no API token needed).
# PyPI must list this repository, this workflow file and the "pypi" environment as a trusted publisher.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Check that the package version matches the release tag
        run: |
          version=$(python -c 'import seqcounter; print(seqcounter.__version__)')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Package version ${version} does not match release tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/seqcounter/
    permissions:
      id-token: write  # Trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
